task: asr_polish
base_model: Qwen/Qwen2.5-3B-Instruct
train_file: sample_data/finetune/asr_polish/train.jsonl
eval_file: sample_data/finetune/asr_polish/eval.jsonl
output_dir: storage/models/lora_asr_polish

# QLoRA
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
num_train_epochs: 3
learning_rate: 2.0e-4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
max_seq_length: 1536
warmup_ratio: 0.03
logging_steps: 10
save_steps: 50
eval_strategy: steps
eval_steps: 50
bf16: true
gradient_checkpointing: true
seed: 42
